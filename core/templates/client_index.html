{% extends 'client_page_base.html' %}

    {% block title %}Offers{% endblock %}

        {% block content %}

        <h1>Offers</h1>

        <!-- ============ FEED / CARD GRID ============ -->
        <div class="feed">
            {% for offer in offers %}
                <article class="offer-card">
                    <a href="{% url 'offer_detail_page' offer.slug %}" class="offer-card-link">
                        <!-- PICTURE -->
                        {% if offer.image %}
                            <img src="{{ offer.image.url }}" alt="{{ offer.title }}">
                                {% endif %}

                            <div class="offer-card-body">

                                <!-- TITLE -->
                                <h2>{{ offer.title }}</h2>

                                <!-- DESCRIPTION -->
                                <p>{{ offer.description }}</p>

                                {# Others #}

                    </a>
        </div>
        </article>

        {% empty %}
        <p>No offers found.</p>
        {% endfor %}
            </div>

            {% endblock %}
