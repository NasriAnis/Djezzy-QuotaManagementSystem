<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Djezzy Client{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'shared/vendor/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'shared/css/djezzy-theme.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-dark text-light">
    <!-- ============ TOP BAR ============ -->
    <header class="navbar navbar-dark bg-black border-bottom border-3 px-3 py-3" style="border-color: var(--bs-primary) !important;">
        <div class="d-flex justify-content-between align-items-center w-100">
            <h2 class="h5 mb-0 text-uppercase">
                <a href="{% url 'client_index_page' %}" class="text-decoration-none text-light">
                    <span style="color: var(--bs-primary);">Djezzy</span> Client
                </a>
            </h2>
            <div class="d-flex align-items-center gap-2">
                <a href="{% url 'client_index_page' %}" class="nav-text-link me-3">Home</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'client_dashboard_page' username=user.username %}" class="btn btn-outline-light btn-sm">
                        My Account
                    </a>
                    <form action="{% url 'client_logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm">Log out</button>
                    </form>
                {% else %}
                    <a href="{% url 'client_login' %}" class="btn btn-outline-light btn-sm">Log in</a>
                    <a href="{% url 'client_signup' %}" class="btn btn-primary btn-sm">Sign up</a>
                {% endif %}
            </div>
        </div>
    </header>
    <div class="container-fluid">
        <main class="content py-4">
            {% block content %}
            {# child templates inject their content here #}
            {% endblock %}
        </main>
    </div>
    <script src="{% static 'shared/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
