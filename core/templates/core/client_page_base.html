<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Djezzy Client{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'core/main.css' %}">

    {#  favicon, fonts, extra CSS links #}
</head>

<body>

    <!-- ============ TOP BAR ============ -->
    <header class="topbar">

        <!-- LOGO -->
        <div class="topbar-logo">
            <h2>Djezzy Client</h2>
        </div>

        <!-- ACCOUNT BUTTONS -->
        <div class="topbar-account">
            {% if user.is_authenticated %}
                <a href="{% url 'client_account_page' username=user.username %}" class="btn btn-account">
                    My Account
                </a>
                <form action="{% url 'client_logout' %}" method="post" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-logout">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'client_login' %}" class="btn btn-login">Log in</a>
                <a href="{% url 'client_signup' %}" class="btn btn-signup">Sign up</a>
            {% endif %}
        </div>

    </header>

    <div class="layout">

        <!-- ============ LEFT SIDEBAR (FILTERS) ============ -->
        <aside class="sidebar">
            <h3>Filters</h3>

            <div class="filter-group">
            </div>

        </aside>

        <!-- ============ MAIN CONTENT ============ -->
        <main class="content">
            {% block content %}
            {# child templates (like index.html) inject their content here #}
            {% endblock %}
        </main>

    </div>

</body>

</html>
