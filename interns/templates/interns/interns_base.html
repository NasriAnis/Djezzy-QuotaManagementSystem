<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Commercials{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'shared/vendor/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'shared/css/djezzy-theme.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-dark text-light">
    <div class="d-flex" style="min-height: 100vh;">
        <!-- ============ SIDEBAR ============ -->
        <nav class="bg-black border-end border-secondary p-3" style="width: 220px; flex-shrink: 0;">
            <h5 class="mb-4 text-uppercase">
                <a href="{% url 'commercials_dashboard_page' %}" class="text-decoration-none text-light">
                    <span style="color: var(--bs-primary);">Djezzy</span> Commercial
                </a>
            </h5>
            <ul class="nav nav-pills flex-column gap-1">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'commercials_dashboard_page' %}active{% else %}text-light{% endif %}"
                       href="{% url 'commercials_dashboard_page' %}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'commercials_offers_page' %}active{% else %}text-light{% endif %}"
                       href="{% url 'commercials_offers_page' %}">Offers</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'commercials_clients_page' %}active{% else %}text-light{% endif %}"
                       href="{% url 'commercials_clients_page' %}">Clients & Stores</a>
                </li>
            </ul>
            <hr class="border-secondary my-4">
            <form action="{% url 'commercials_logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger btn-sm w-100">Log out</button>
            </form>
        </nav>
        <!-- ============ MAIN CONTENT ============ -->
        <main class="flex-grow-1 p-4">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{% static 'shared/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
